name: Deploy dashboard

on:
  push:
    branches: [main]
  # A scrape commits with GITHUB_TOKEN, which by design does not trigger the
  # push event above. Chain off the scrape workflow instead so new rates
  # actually reach the site.
  workflow_run:
    workflows: ["Scrape rates"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # Static mode reads this file instead of calling the API, so the whole
      # dashboard is a folder of files with no server behind it.
      - name: Stage the rate history
        run: |
          mkdir -p web/public
          cp data/rates.csv web/public/rates.csv

      - name: Build
        working-directory: web
        env:
          VITE_DATA_MODE: static
          VITE_BASE: /birrwatch/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
