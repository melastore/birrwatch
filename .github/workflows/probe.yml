name: Probe NBE TLS

# Temporary diagnostic. Delete once the connection question is settled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      - name: Build
        working-directory: server
        run: CGO_ENABLED=0 go build -o ../bin/birrscrape ./cmd/birrscrape

      - name: Scrape the live site
        run: ./bin/birrscrape -db probe.db -source nbe

      - name: Show what was parsed
        run: |
          sudo apt-get install -qq -y sqlite3 >/dev/null 2>&1
          echo "--- rates ---"
          sqlite3 -header -column probe.db "SELECT currency, date, buying, selling FROM rates ORDER BY currency;"
          echo "--- counts ---"
          sqlite3 probe.db "SELECT 'rows', COUNT(*) FROM rates;"

      - name: Save the raw page for the fixture
        if: always()
        run: |
          curl -sSk -o nbe-live.html --max-time 25 https://nbe.gov.et/exchange/ || true
          ls -la nbe-live.html || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbe-live-html
          path: nbe-live.html
          if-no-files-found: warn
