name: Probe NBE TLS

# Temporary diagnostic. Delete once the connection question is settled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the bundled JS
        run: |
          curl -sSk -o bundle.js --max-time 30 \
            "https://nbe.gov.et/wp-content/litespeed/js/e25100f0024053ca0175bcc9ac180523.js?ver=80344"
          wc -c bundle.js

      - name: Find what populates the rate table
        run: |
          python3 - <<'PY'
          import re
          s = open("bundle.js", encoding="utf-8", errors="replace").read()
          print("=== exchangeData mentions ===")
          for m in re.finditer(r'exchangeData\w*', s):
              print(m.start(), repr(s[max(0,m.start()-500):m.start()+500]))
              print()
          print("=== url-ish strings with exchange/rate/api ===")
          for u in sorted(set(re.findall(r'["\'`][^"\'`]{0,160}(?:exchange|admin-ajax|wp-json|rest_route|/api/)[^"\'`]{0,160}["\'`]', s, re.I))):
              print(" ", u[:220])
          PY

      - name: Try the REST page object
        run: |
          curl -sSk --max-time 25 "https://nbe.gov.et/wp-json/wp/v2/pages/24254" -o page.json
          python3 -c "
          import json,re
          d=json.load(open('page.json'))
          c=d.get('content',{}).get('rendered','')
          print('content bytes:', len(c))
          print('tables:', len(re.findall(r'<table', c, re.I)))
          print('has empty tbody:', 'exchangeData2q1' in c)
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbe-bundle
          path: |
            bundle.js
            page.json
          if-no-files-found: warn
