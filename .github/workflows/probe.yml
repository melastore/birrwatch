name: Probe NBE TLS

# Temporary diagnostic. Delete once the connection question is settled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Certificate on api.nbe.gov.et
        run: |
          echo | openssl s_client -connect api.nbe.gov.et:443 -servername api.nbe.gov.et 2>/dev/null \
            | openssl x509 -noout -subject -issuer -ext subjectAltName || echo "s_client failed"

      - name: Verified TLS?
        run: curl -sS -o /dev/null -w "verified: %{http_code}\n" --max-time 20 "https://api.nbe.gov.et/api/filter-exchange-rates?date=2026-08-14" || true

      - name: Today
        run: |
          curl -sSk --max-time 25 "https://api.nbe.gov.et/api/filter-exchange-rates?date=$(date -u +%F)" -o today.json
          echo "bytes: $(wc -c < today.json)"
          head -c 900 today.json; echo

      - name: A past date (does history work?)
        run: |
          for d in 2026-08-14 2026-06-02 2026-01-15 2025-09-11; do
            curl -sSk --max-time 25 "https://api.nbe.gov.et/api/filter-exchange-rates?date=$d" -o "d.json"
            n=$(python3 -c "import json;print(len(json.load(open('d.json')).get('data',[])))" 2>/dev/null || echo ERR)
            first=$(python3 -c "
          import json
          d=json.load(open('d.json')).get('data',[])
          print(d[0] if d else '-')
          " 2>/dev/null || echo ERR)
            echo "$d -> rows=$n  first=$first"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbe-api
          path: today.json
          if-no-files-found: warn
