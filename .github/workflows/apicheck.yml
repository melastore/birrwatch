name: API reachability check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Does normal TLS verification work now?
        run: |
          curl -sS -o /dev/null -w 'verified-main code=%{http_code}\n' --max-time 20 \
            https://nbe.gov.et/exchange/ || echo "verified-main FAILED"
          curl -sS -o /dev/null -w 'verified-api  code=%{http_code}\n' --max-time 20 \
            https://api.nbe.gov.et/ || echo "verified-api FAILED"

      - name: Candidate endpoints
        run: |
          for u in \
            "https://api.nbe.gov.et/api/filter-exchange-rates?date=2026-08-14" \
            "https://api.nbe.gov.et/api/exchange-rates" \
            "https://api.nbe.gov.et/api/filter-exchange-rates" \
            "https://nbe.gov.et/api/filter-exchange-rates?date=2026-08-14" \
            "https://api.nbe.gov.et/" ; do
            code=$(curl -sS -o /tmp/o -w '%{http_code}' --max-time 20 "$u" 2>/dev/null || echo 000)
            ct=$(file -b --mime-type /tmp/o 2>/dev/null || echo "?")
            echo "$code  $ct  $u"
          done

      - name: Is the exchange page server-rendering rates now?
        run: |
          curl -sS -o ex.html --max-time 25 https://nbe.gov.et/exchange/ || true
          echo "bytes: $(wc -c < ex.html)"
          echo "tables: $(grep -oic '<table' ex.html || echo 0)"
          echo "empty tbody present: $(grep -c 'exchangeData2q1' ex.html || echo 0)"
          echo "--- rows inside the rate tbody, if any ---"
          python3 - <<'PY'
          import re
          s=open("ex.html",encoding="utf-8",errors="replace").read()
          m=re.search(r'<tbody id="exchangeData2q1".*?</tbody>', s, re.S)
          print(repr(m.group(0)[:400]) if m else "tbody not found")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apicheck
          path: ex.html
          if-no-files-found: warn
